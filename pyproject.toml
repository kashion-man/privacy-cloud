[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "privacy-infer"
version = "0.1.0"
description = "Local Qwen3 and privacy-gated DeepSeek inference research prototype"
requires-python = ">=3.11"
dependencies = ["torch>=2.5", "transformers>=4.51,<6", "safetensors>=0.4"]

[project.optional-dependencies]
agent = ["langgraph==1.2.21"]
train = ["accelerate>=1,<2", "peft>=0.13,<1"]
gpu = [
    "flash-attn>=2.8.3,<3",
    "flashinfer-python==0.7.2.post1",
    "triton>=3.3,<4",
    "tokenizers>=0.22,<1",
    "numpy>=1.26",
    "tqdm>=4.66",
    "xxhash>=3",
    "ninja>=1.11",
]

[project.scripts]
privacy-infer = "privacy_infer.cli:main"
privacy-agent = "privacy_infer.agent_cli:main"

[tool.setuptools.packages.find]
include = ["privacy_infer*"]

[tool.setuptools.package-data]
"privacy_infer.eager" = ["LICENSE"]
"privacy_infer.accelerated" = ["LICENSE"]
