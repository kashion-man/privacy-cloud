[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "privacy-infer"
version = "0.1.0"
description = "Local Qwen3 and privacy-gated DeepSeek inference research prototype"
requires-python = ">=3.11"
dependencies = ["torch>=2.5", "transformers>=4.51,<6", "safetensors>=0.4"]

[project.optional-dependencies]
agent = ["langgraph==1.2.21"]
train = ["accelerate>=1,<2", "peft>=0.13,<1"]

[project.scripts]
privacy-infer = "privacy_infer.cli:main"
privacy-agent = "privacy_infer.agent_cli:main"

[tool.setuptools.packages.find]
include = ["privacy_infer*"]

[tool.setuptools.package-data]
"privacy_infer.v0" = ["LICENSE"]
